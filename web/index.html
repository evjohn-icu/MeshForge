<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>组队安装器</title><link rel="stylesheet" href="/app.css"></head><body>
<main class="shell"><header class="masthead"><div><p class="eyebrow">EASYTIER / LOCAL CONTROL</p><h1>组队安装器</h1></div><div id="status" class="status">正在连接本地控制器…</div></header>
<section class="intro"><p>填写组网和机器登录信息。Relay 与 Linux 节点可 SSH 直接部署；任意节点也能生成专属短期安装链接。Windows 生成可复制的 <code>irm | iex</code> 命令和二维码。</p></section>
<form id="project-form"><section class="panel"><div class="section-heading"><span>01</span><h2>网络</h2></div><div class="grid three"><label>项目名称<input name="name" required placeholder="例如：设计组"></label><label>EasyTier 版本<input name="releaseVersion" required placeholder="v2.6.4"></label><label>网络名称<input name="networkName" required placeholder="team-network"></label><label class="wide">网络密钥<input name="networkSecret" required type="password" autocomplete="new-password" placeholder="至少 16 位随机字符串"></label><label>GitHub 下载代理<input name="githubProxy" placeholder="https://ghfast.top/"></label><label>安装脚本公开地址<input name="scriptBaseURL" placeholder="https://installer.example.com"></label><label>中心 WireGuard Portal<input name="wireGuardEnabled" type="checkbox"></label><label>WireGuard UDP 端口<input name="wireGuardPort" type="number" value="11013"></label><label>WireGuard 客户端网段<input name="wireGuardCIDR" placeholder="10.14.14.0/24"></label></div></section>
<section class="panel"><div class="section-heading"><span>02</span><h2>公网 Relay VPS</h2><small>Relay 会开放 TCP/UDP 11010；推荐虚拟 IP：10.144.144.1。</small></div><div id="relay-fields" class="node-fields"></div></section>
<section class="panel"><div class="section-heading"><span>03</span><h2>成员节点</h2><button type="button" id="add-node" class="quiet">添加节点</button></div><div id="nodes" class="nodes"></div></section><div class="actions"><button type="submit" class="primary">保存组网配置</button></div></form>
<section class="panel deployment-panel"><div class="section-heading"><span>04</span><h2>部署</h2><small>专属链接默认仅能使用一次，60 分钟后失效。</small></div><div id="deployment-list" class="deployment-list"></div></section></main>
<dialog id="output-dialog"><div class="dialog-heading"><h2 id="dialog-title">生成结果</h2><button id="close-dialog" class="quiet">关闭</button></div><p id="dialog-message"></p><img id="qr-code" alt="安装命令二维码" hidden><pre id="output"></pre><button id="copy-output" class="primary">复制全部</button></dialog>
<template id="node-template"><article class="node-card"><div class="node-header"><strong class="node-title"></strong><button type="button" class="remove-node quiet">移除</button></div><div class="node-fields"></div></article></template><script src="/app.js"></script></body></html>
