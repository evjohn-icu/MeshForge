<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>组队安装器</title><link rel="stylesheet" href="/app.css"></head><body>
<main class="shell"><header class="masthead"><div><p class="eyebrow">EASYTIER / LOCAL CONTROL</p><h1>组队安装器</h1></div><div id="status" class="status">正在连接本地控制器…</div></header>
<section class="intro"><p>填网络信息，加机器，拿安装命令。SSH 部署是可选项——不填也能用安装链接。只需一条命令装机器？用<a href="/generator.html" style="color:var(--blue);font-weight:650">纯前端配置生成器</a>。</p></section>
<form id="project-form">
<section class="panel"><div class="section-heading"><span>01</span><h2>网络</h2></div><div class="grid three"><label>项目名称<input name="name" required placeholder="例如：设计组"></label><label>网络名称<input name="networkName" required placeholder="team-network"></label><label class="wide">网络密钥<input name="networkSecret" required type="password" autocomplete="new-password" placeholder="至少 16 位随机字符串"></label><label>IPv4 网段<input name="ipv4CIDR" required placeholder="10.144.144.0/24"></label></div>
<div class="toggles"><label class="toggle"><input name="magicDNS" type="checkbox"><span><strong>MagicDNS</strong><small>用节点名互相访问（如 office-pc.et.net）；会修改系统 DNS 设置</small></span></label><label class="toggle"><input name="wireGuardEnabled" type="checkbox"><span><strong>WireGuard Portal</strong><small>让手机等 WireGuard 客户端接入组网</small></span></label></div>
<details class="advanced"><summary>高级选项</summary><div class="grid three"><label>EasyTier 版本<input name="releaseVersion" required placeholder="v2.6.4"></label><label>GitHub 下载代理<input name="githubProxy" placeholder="https://ghfast.top/"></label><label>安装脚本公开地址<input name="scriptBaseURL" placeholder="https://installer.example.com"></label><label>WireGuard UDP 端口<input name="wireGuardPort" type="number"></label><label>WireGuard 客户端网段<input name="wireGuardCIDR" placeholder="10.14.14.0/24"></label><label class="toggle"><input name="dhcp" type="checkbox"><span><strong>DHCP 自动分配</strong><small>IP 由 EasyTier 分配（从 10.0.0.1 起），忽略上方网段</small></span></label></div></details>
</section>
<section class="panel"><div class="section-heading"><span>02</span><h2>节点</h2><button type="button" id="add-node" class="quiet">添加节点</button></div>
<div class="relay-card"><div class="node-header"><strong class="node-title">公网 Relay VPS</strong><small>其他节点通过它入网；需公网可达</small></div><div id="relay-fields" class="node-fields"></div></div>
<div id="nodes" class="nodes"></div></section>
<div class="actions"><button type="submit" class="primary">保存组网配置</button></div></form>
<section class="panel deployment-panel"><div class="section-heading"><span>03</span><h2>部署</h2><small>专属链接默认仅能使用一次，60 分钟后失效。</small></div><div id="deployment-list" class="deployment-list"></div></section></main>
<dialog id="output-dialog"><div class="dialog-heading"><h2 id="dialog-title">生成结果</h2><button id="close-dialog" class="quiet">关闭</button></div><p id="dialog-message"></p><img id="qr-code" alt="安装命令二维码" hidden><pre id="output"></pre><button id="copy-output" class="primary">复制全部</button></dialog>
<template id="node-template"><article class="node-card"><div class="node-header"><strong class="node-title"></strong><button type="button" class="remove-node quiet">移除</button></div><div class="node-fields"></div></article></template><script src="/app.js"></script></body></html>
